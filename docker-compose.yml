version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lifeops_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: lifeops
      POSTGRES_PASSWORD: lifeops_dev
      POSTGRES_DB: lifeops
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeops -d lifeops"]
      interval: 5s
      timeout: 3s
      retries: 5
